# Example configuration for the Gitea-Jenkins webhook service
server:
  listen_addr: ":8080"
  webhook_secret: "replace-me"
  worker_pool_size: 4
  queue_size: 100

jenkins:
  base_url: "https://jenkins.example.com"
  username: "jenkins-user"
  api_token: "jenkins-api-token"
  poll_interval: 15s
  timeout: 5m
  insecure_skip_verify: false  # Установите true для игнорирования некорректных SSL-сертификатов

gitea:
  base_url: "https://gitea.example.com/api/v1"
  token: "gitea-personal-access-token"
  insecure_skip_verify: false  # Установите true для игнорирования некорректных SSL-сертификатов

repositories:
  - name: "org/repo-one"
    job_root: "org_name/repo_name"
    job_pattern: "^PR-{{ .Number }}-build$"
    poll_interval: 10s
    timeout: 3m
    success_comment_template: "✅ Jenkins job {{ .JobName }} готов: {{ .JobURL }}"
    failure_comment_template: "⚠️ Не удалось обнаружить джобу для PR {{ .Number }} за {{ .Timeout }}."
    # Необязательный список проверок этого репозитория.
    # Каждое правило публикует отдельный статус коммита.
    # Общие поля одинаковы для всех типов: name, type, context, target_branches,
    # success_description, failure_description.
    # Настройки типа лежат во вложенном объекте с ключом, равным type.
    checks:
      - name: forbidden-files
        type: file_blacklist
        context: "checks/forbidden-files"
        # Регулярные выражения Go для целевой ветки PR (base.ref).
        # Чтобы покрыть все ветки, укажите ".*" .
        target_branches:
          - "^main$"
          - "^release/.*"
        success_description: "Файлы из чёрного списка не изменены"
        failure_description: "Изменены файлы из чёрного списка"
        file_blacklist:
          # Glob относительно корня репозитория.
          # * и ? не переходят через /, ** — любое число каталогов.
          patterns:
            - "go.sum"
            - "vendor/**"
            - "**/.env"
            - "deploy/production.yaml"

  - name: "org/repo-two"
    job_pattern: "^deploy-repo-two-{{ .Number }}$"
